name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # If using Capacitor or Cordova, sync assets first
      - name: Build Web Assets & Sync Capacitor (Optional/Auto-detect)
        run: |
          if [ -f "capacitor.config.json" ] || [ -f "capacitor.config.ts" ]; then
            npm run build
            npx cap sync android
          fi

      - name: Grant execute permission for gradlew
        run: |
          if [ -d "android" ]; then
            chmod +x android/gradlew
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Release APK
        run: |
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleRelease --no-daemon
          elif [ -f "gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "Android directory or gradlew wrapper not found. Please ensure your Android project files are committed."
            exit 1
          fi

      - name: Locate Output APK
        id: locate_apk
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Create Release Tag if not present
        id: prep_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="release-$(date +'%Y%m%d-%H%M%S')"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact to Action Summary
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.locate_apk.outputs.apk_path }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_tag.outputs.tag_name }}
          name: "Release ${{ steps.prep_tag.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.locate_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
