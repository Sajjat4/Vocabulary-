name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Prepare Capacitor & Android Project
        run: |
          echo "Installing Capacitor..."
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev

          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo "Creating capacitor.config.json..."
            cat << 'EOF' > capacitor.config.json
{
  "appId": "com.zoya.app",
  "appName": "Zoya AI",
  "webDir": "dist",
  "bundledWebRuntime": false
}
EOF
          fi

          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          else
            echo "Syncing Android platform..."
            npx cap sync android
          fi

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android APK with Gradle
        run: |
          cd android
          # Assemble debug APK (guaranteed to succeed without custom signing keystores)
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate Output APK
        id: locate_apk
        run: |
          APK_PATH=$(find android/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in android directory!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Create Release Tag if not present
        id: prep_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v$(date +'%Y.%m.%d-%H%M%S')"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoya-android-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_tag.outputs.tag_name }}
          name: "Release ${{ steps.prep_tag.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
